[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hh"
version = "0.1.0"
description = "CLI tool for fetching and caching data from hh.ru"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.9.0",
    "requests>=2.31.0",
    "platformdirs>=4.0",
    "markdownify>=0.13.0"
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
hh = "hh.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"